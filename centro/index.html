<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SRM Explorer · Magliano centro (bozza)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--arancio:#f2a900;--scuro:#1d2b24;--chiaro:#f3efe2;--grigio:#9aa39d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#dfe7ea;font-family:Oswald,sans-serif;color:var(--chiaro);touch-action:none;overscroll-behavior:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:stretch;background:linear-gradient(180deg,rgba(14,22,18,.86),rgba(14,22,18,.55));backdrop-filter:blur(4px);pointer-events:none;z-index:5}
#hud .b{padding:10px 16px;border-right:1px solid rgba(255,255,255,.08)}
#hud .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--grigio)}
#hud .v{font-size:22px;line-height:1.1;font-weight:500}
#hud .v small{font-size:12px;color:var(--grigio);font-weight:400}
#hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(14,22,18,.72);color:#dfe4dc;font-size:12px;letter-spacing:.04em;padding:6px 12px;border-radius:14px;white-space:nowrap;z-index:5;pointer-events:none}
#tag{position:fixed;top:72px;right:14px;background:rgba(242,169,0,.92);color:#1d2b24;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:4px;z-index:5;pointer-events:none;font-weight:600}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1d2b24;z-index:20;flex-direction:column;gap:14px;transition:opacity .5s}
#load .bar{width:220px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:var(--arancio)}
#load.off{opacity:0;pointer-events:none}
#card{position:fixed;left:14px;bottom:52px;max-width:360px;background:rgba(243,239,226,.96);color:#1d2b24;border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.35;z-index:6;display:none;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#card.on{display:block}
#card h2{font-size:17px;font-weight:600;margin-bottom:4px}
#card .x{position:absolute;top:6px;right:10px;cursor:pointer;font-size:16px;color:#666}
#joy{position:fixed;left:18px;bottom:70px;width:120px;height:120px;border-radius:50%;background:rgba(14,22,18,.35);border:1px solid rgba(255,255,255,.25);z-index:6;display:none;touch-action:none}
#joy i{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(242,169,0,.9)}
#brun{position:fixed;right:22px;bottom:84px;width:74px;height:74px;border-radius:50%;background:rgba(242,169,0,.9);color:#1d2b24;font-weight:600;font-size:13px;letter-spacing:.08em;border:0;z-index:6;display:none;touch-action:none}
@media (pointer:coarse){#joy,#brun{display:block}#hint{display:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div class="b" style="min-width:230px"><div class="k">Magliano de' Marsi · centro</div><div class="v" id="via">—</div></div>
  <div class="b"><div class="k">Quota</div><div class="v" id="q">— <small>m</small></div></div>
  <div class="b"><div class="k">Dal Municipio</div><div class="v" id="d">— <small>m</small></div></div>
</div>
<div id="tag">bozza · branch modellazione_centro</div>
<div id="hint">▲▼ cammina · ◀ ▶ gira · MAIUSC corri · trascina per girare la vista · rotella zoom · tocca un edificio per la scheda</div>
<div id="card"><span class="x" onclick="document.getElementById('card').classList.remove('on')">✕</span><div id="card-b"></div></div>
<div id="joy"><i></i></div>
<button id="brun">CORRI</button>
<div id="load"><div style="font-size:20px;letter-spacing:.1em">MAGLIANO · CENTRO</div><div class="bar"><i id="lbar"></i></div><div id="ltxt" style="font-size:12px;color:#9aa39d">carico il paese…</div></div>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
<script type="module" src="app.js?v=4"></script>
</body>
</html>
